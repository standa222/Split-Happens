stages:
  - build
  - test
  - publish
  - deploy

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"
  MAVEN_CLI_OPTS: "--batch-mode --errors --fail-at-end --show-version"

cache:
  paths:
    - backend/.m2/repository

# Build the backend
build-backend:
  stage: build
  image: maven:3.9-eclipse-temurin-21
  script:
    - cd backend
    - mvn $MAVEN_CLI_OPTS clean package -DskipTests
  artifacts:
    paths:
      - backend/target/*.jar
    expire_in: 1 hour

build_frontend:
  stage: build
  image: node:20-alpine
  script:
    - cd frontend
    - npm install
    - npm run build

test-backend:
  stage: test
  image: maven:3.9-eclipse-temurin-21
  services:
    - postgres:17-alpine
  variables:
    POSTGRES_DB: splithappens_test
    POSTGRES_USER: test
    POSTGRES_PASSWORD: test
    DATABASE_URL: jdbc:postgresql://postgres:5432/splithappens_test
    DB_USERNAME: test
    DB_PASSWORD: test
    SHOW_SQL: "false"
  script:
    - cd backend
    - mvn $MAVEN_CLI_OPTS test
    - echo "Extracting coverage percentage..."
    - awk -F"," '{ instructions += $4 + $5; covered += $5 } END { print "Total coverage:", 100*covered/instructions, "%" }' target/site/jacoco/jacoco.csv
  cache:
    key: "${CI_COMMIT_REF_SLUG}-maven"
    paths:
      - backend/.m2/repository
    policy: pull
  artifacts:
    when: always
    paths:
      - backend/target/surefire-reports/
      - backend/target/site/jacoco/
    reports:
      junit:
        - backend/target/surefire-reports/TEST-*.xml
      coverage_report:
        coverage_format: cobertura
        path: backend/target/site/jacoco/jacoco.xml
    expire_in: 7 days
  coverage: "/Total coverage: ([0-9.]+)/"

publish_backend:
  stage: publish
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  before_script:
    - docker login -u $DOCKER_HUB_USER -p $DOCKER_HUB_TOKEN
  script:
    - docker build -t $DOCKER_HUB_USER/splithappens-backend:latest ./backend
    - docker push $DOCKER_HUB_USER/splithappens-backend:latest
  only:
    - main

deploy_backend:
  stage: deploy
  image: curlimages/curl:latest
  script:
    - curl -X POST $RENDER_DEPLOY_HOOK
  only:
    - main

deploy_frontend:
  stage: deploy
  image: node:20-alpine
  script:
    - cd frontend
    - npm install
    - npx vercel pull --yes --environment=production --token=$VERCEL_TOKEN
    - npx vercel build --prod --token=$VERCEL_TOKEN
    - npx vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN
  only:
    - main