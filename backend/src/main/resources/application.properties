# App Metadata
spring.application.name=splithappens-backend

# Database Configuration with Environment Variable Fallbacks
# Format: ${VARIABLE_NAME:DEFAULT_VALUE}
spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:splithappens;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DATABASE_USER:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=${DATABASE_DRIVER:org.h2.Driver}

# JPA / Hibernate settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=${HIBERNATE_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.show-sql=true